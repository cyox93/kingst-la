[project]
name = "kingst-la"
version = "0.1.0"
description = "sigrok-cli compatible capture for Kingst LA logic analyzers (LA5016) over libusb"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["logic-analyzer", "kingst", "la5016", "sigrok", "usb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = ["pyusb>=1.2", "numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kla = "kingst_la.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kingst_la = ["data/firmware/*.fw", "data/firmware/*.bitstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hw and not decoders'"
markers = ["hw: needs a connected LA5016 with extracted firmware", "decoders: needs installed sigrok protocol decoders"]
